[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colombia_global_market_analysis"
version = "0.1.0"
description = "Herramientas para análisis del mercado financiero colombiano"
readme = "README.md"
requires-python = ">=3.13"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["market_col*"]