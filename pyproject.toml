[tool.poetry]
name = "colombia_global_market_analysis"
version = "0.1.0"
description = "Herramientas para análisis del mercado financiero colombiano"
readme = "README.md"
packages = [
    { include = "market_col", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
pandas = "*"
plotly = "*"
openpyxl = "*"
streamlit = "*"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"